name: Build Windows exe

# Собирает source/ -> dist/FiveMChatOverlay.exe прямо в облаке GitHub.
#
# Как получить exe бесплатно и без установки Python:
#   1) залейте репозиторий (папки dist и source);
#   2) вкладка Actions -> «Build Windows exe» -> Run workflow;
#   3) через 3-5 минут скачайте FiveMChatOverlay.exe в разделе Artifacts
#      (или запустите `git tag v1.0 && git push --tags` — exe сам прикрепится к Releases).

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: source

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build exe into dist/
        run: python -m PyInstaller --noconfirm --clean --distpath ../dist FiveMChatOverlay.spec

      - name: Write README and checksum sidecars
        run: python tools/write_release_info.py ../dist/FiveMChatOverlay.exe

      - name: Show result
        working-directory: .
        run: |
          dir dist
          python -c "import os;print('FiveMChatOverlay.exe:', round(os.path.getsize('dist/FiveMChatOverlay.exe')/1048576, 1), 'MB')"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: FiveMChatOverlay-release-files
          path: |
            dist/FiveMChatOverlay.exe
            dist/FiveMChatOverlay-README.txt
            dist/FiveMChatOverlay.exe.md5
            dist/FiveMChatOverlay.exe.sha256
          if-no-files-found: error

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/FiveMChatOverlay.exe
            dist/FiveMChatOverlay-README.txt
            dist/FiveMChatOverlay.exe.md5
            dist/FiveMChatOverlay.exe.sha256
          name: FiveM Chat Overlay ${{ github.ref_name }}
          body: |
            Готовый файл: **FiveMChatOverlay.exe** — скачать и запустить, ничего устанавливать не нужно.
            Рядом опубликованы `FiveMChatOverlay-README.txt` и контрольные суммы MD5/SHA-256.
            VirusTotal не запускается автоматически: отчёт нужно получить отдельно для этой сборки.
            Исходники и инструкции — в папке `source/` репозитория.
          draft: false
