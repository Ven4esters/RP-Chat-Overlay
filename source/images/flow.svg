<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="250" rx="16" fill="#14141a" stroke="#2a2a36"/>
  <text x="24" y="40" fill="#f2f2f2" font-size="17" font-weight="600">Порядок работы: сначала чат игры, потом оверлей</text>

  <!-- шаги -->
  <g>
    <rect x="15" y="62" width="150" height="94" rx="12" fill="#1c1c24" stroke="#3a3a48"/>
    <circle cx="42" cy="88" r="13" fill="#3d6fd8"/>
    <text x="42" y="93" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">1</text>
    <text x="64" y="93" fill="#ffffff" font-size="15" font-weight="600">F6</text>
    <text x="30" y="122" fill="#c8c8d2" font-size="12">горячая</text>
    <text x="30" y="139" fill="#c8c8d2" font-size="12">клавиша</text>
  </g>

  <g>
    <rect x="195" y="62" width="150" height="94" rx="12" fill="#1c1c24" stroke="#66d18b"/>
    <circle cx="222" cy="88" r="13" fill="#2e7d32"/>
    <text x="222" y="93" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">2</text>
    <text x="244" y="93" fill="#ffffff" font-size="15" font-weight="600">T в игре</text>
    <text x="210" y="122" fill="#9fe3b5" font-size="12">чат открыт —</text>
    <text x="210" y="139" fill="#9fe3b5" font-size="12">вас видят</text>
  </g>

  <g>
    <rect x="375" y="62" width="150" height="94" rx="12" fill="#1c1c24" stroke="#3a3a48"/>
    <circle cx="402" cy="88" r="13" fill="#3d6fd8"/>
    <text x="402" y="93" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">3</text>
    <text x="424" y="93" fill="#ffffff" font-size="15" font-weight="600">Оверлей</text>
    <text x="390" y="122" fill="#c8c8d2" font-size="12">печатаете</text>
    <text x="390" y="139" fill="#c8c8d2" font-size="12">по-русски</text>
  </g>

  <g>
    <rect x="555" y="62" width="150" height="94" rx="12" fill="#1c1c24" stroke="#3a3a48"/>
    <circle cx="582" cy="88" r="13" fill="#3d6fd8"/>
    <text x="582" y="93" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">4</text>
    <text x="604" y="93" fill="#ffffff" font-size="15" font-weight="600">Enter</text>
    <text x="570" y="122" fill="#c8c8d2" font-size="12">вставка в уже</text>
    <text x="570" y="139" fill="#c8c8d2" font-size="12">открытый чат</text>
  </g>

  <g>
    <rect x="735" y="62" width="150" height="94" rx="12" fill="#1c1c24" stroke="#5b8cff"/>
    <circle cx="762" cy="88" r="13" fill="#3d6fd8"/>
    <text x="762" y="93" fill="#ffffff" font-size="13" font-weight="700" text-anchor="middle">5</text>
    <text x="784" y="93" fill="#ffffff" font-size="15" font-weight="600">Чат игры</text>
    <text x="752" y="122" fill="#b9c4ff" font-size="12">«Чао, брат!»</text>
    <text x="752" y="139" fill="#8a8a96" font-size="11">как итальянец</text>
  </g>

  <!-- стрелки -->
  <g stroke="#4a4a58" stroke-width="2" fill="none">
    <path d="M167 109 H191"/><path d="M347 109 H371"/><path d="M527 109 H551"/><path d="M707 109 H731"/>
  </g>
  <g fill="#4a4a58">
    <polygon points="191,104 199,109 191,114"/>
    <polygon points="371,104 379,109 371,114"/>
    <polygon points="551,104 559,109 551,114"/>
    <polygon points="731,104 739,109 731,114"/>
  </g>

  <text x="24" y="190" fill="#8a8a96" font-size="12">Пока открыт оверлей, чат игры остаётся открытым — другие игроки видят, что вы печатаете, а не стоите без действия.</text>
  <text x="24" y="216" fill="#8a8a96" font-size="12">Esc — отмена: закрываются и оверлей, и пустой чат игры. Если игра не найдена, оверлей открывается сразу, как раньше.</text>
  <text x="24" y="250" fill="#8a8a96" font-size="12">По умолчанию F6 открывает оверлей, T — игровой чат; обе клавиши можно изменить в настройках.</text>
</svg>
