<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="470" rx="16" fill="#0f0f14" stroke="#2a2a36"/>

  <!-- окно -->
  <rect x="12" y="12" width="876" height="404" rx="14" fill="#14141a" stroke="#2e2e3a"/>

  <!-- заголовок окна -->
  <text x="34" y="48" fill="#f2f2f2" font-size="17" font-weight="600">Настройки — RP Chat Overlay</text>
  <text x="34" y="70" fill="#8a8a96" font-size="12">Язык: Итальянский (Italiano) · горячая клавиша: F6 · частота автоперевода: каждое 4-е</text>
  <line x1="12" y1="88" x2="888" y2="88" stroke="#26262f"/>

  <!-- сайдбар -->
  <rect x="12" y="88" width="196" height="278" fill="#17171e"/>
  <rect x="26" y="102" width="168" height="34" rx="8" fill="#26263a"/>
  <text x="42" y="124" fill="#ffffff" font-size="13" font-weight="600">Основные</text>
  <text x="42" y="166" fill="#c8c8d2" font-size="13">Автоперевод</text>
  <text x="42" y="202" fill="#c8c8d2" font-size="13">Чат игры</text>
  <text x="42" y="238" fill="#c8c8d2" font-size="13">Словарь</text>
  <text x="42" y="274" fill="#c8c8d2" font-size="13">Проверка</text>

  <!-- карточка 1: язык -->
  <rect x="226" y="102" width="644" height="96" rx="10" fill="#1c1c24" stroke="#2e2e3a"/>
  <text x="246" y="127" fill="#dfe3ff" font-size="14" font-weight="600">Язык перевода</text>
  <text x="246" y="147" fill="#8a8a96" font-size="11">Печатаете по-русски — в чат уходит текст на выбранном языке</text>
  <rect x="246" y="156" width="300" height="28" rx="6" fill="#0e0e12" stroke="#5b8cff"/>
  <text x="258" y="175" fill="#f2f2f2" font-size="12">Итальянский (Italiano)</text>
  <path d="M522 167 L529 167 L525.5 172 Z" fill="#8a8a96"/>
  <text x="562" y="175" fill="#8a8a96" font-size="11">Что уходит в чат:</text>
  <rect x="668" y="156" width="180" height="28" rx="6" fill="#0e0e12" stroke="#3a3a48"/>
  <text x="678" y="175" fill="#f2f2f2" font-size="12">Русская запись</text>

  <!-- карточка 2: клавиша -->
  <rect x="226" y="210" width="644" height="76" rx="10" fill="#1c1c24" stroke="#2e2e3a"/>
  <text x="246" y="235" fill="#dfe3ff" font-size="14" font-weight="600">Горячая клавиша</text>
  <text x="246" y="255" fill="#8a8a96" font-size="11">Кликните по полю и нажмите сочетание — оно запишется само</text>
  <rect x="246" y="262" width="150" height="26" rx="6" fill="#0e0e12" stroke="#3a3a48"/>
  <text x="258" y="280" fill="#b9c4ff" font-size="12">F6</text>
  <rect x="408" y="262" width="46" height="26" rx="6" fill="#26262f" stroke="#3a3a48"/>
  <text x="419" y="280" fill="#f2f2f2" font-size="11">F6</text>

  <!-- карточка 3: автоперевод -->
  <rect x="226" y="296" width="644" height="60" rx="10" fill="#1c1c24" stroke="#2e2e3a"/>
  <text x="246" y="318" fill="#dfe3ff" font-size="14" font-weight="600">Автоперевод</text>
  <text x="246" y="340" fill="#c8c8d2" font-size="12">Частота</text>
  <rect x="320" y="325" width="140" height="24" rx="6" fill="#0e0e12" stroke="#3a3a48"/>
  <text x="330" y="342" fill="#f2f2f2" font-size="12">каждое 4-е</text>
  <rect x="474" y="327" width="14" height="14" rx="4" fill="#3d6fd8" stroke="#4f7ee6"/>
  <text x="496" y="340" fill="#c8c8d2" font-size="12">Слова-паразиты всегда</text>
  <text x="656" y="340" fill="#66d18b" font-size="11">Senti · Ma dai · Piano piano</text>

  <!-- футер -->
  <line x1="12" y1="366" x2="888" y2="366" stroke="#26262f"/>
  <text x="34" y="392" fill="#8a8a96" font-size="11">Изменения применятся после «Сохранить»</text>
  <rect x="560" y="378" width="110" height="28" rx="7" fill="#26262f" stroke="#3a3a48"/>
  <text x="578" y="397" fill="#f2f2f2" font-size="12">Сбросить всё</text>
  <rect x="680" y="378" width="90" height="28" rx="7" fill="#26262f" stroke="#3a3a48"/>
  <text x="700" y="397" fill="#f2f2f2" font-size="12">Отмена</text>
  <rect x="780" y="378" width="90" height="28" rx="7" fill="#3d6fd8" stroke="#4f7ee6"/>
  <text x="796" y="397" fill="#ffffff" font-size="12" font-weight="600">Сохранить</text>

  <!-- подписи-выноски -->
  <text x="24" y="440" fill="#8a8a96" font-size="12">5 разделов · подсказка к каждому полю · проверка ввода горячей клавиши · живой предпросмотр перевода в разделе «Проверка»</text>
  <text x="24" y="460" fill="#8a8a96" font-size="12">Окно открывается при запуске (можно отключить) и из меню трея: «Настройки…»</text>
</svg>
