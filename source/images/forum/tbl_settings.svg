<svg xmlns="http://www.w3.org/2000/svg" width="720" height="487" viewBox="0 0 720 487" font-family="DejaVu Sans, Noto Sans CJK SC, Noto Sans CJK JP, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e1017"/><stop offset="0.55" stop-color="#151824"/>
    <stop offset="1" stop-color="#0f1319"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2fa364"/><stop offset="1" stop-color="#6fdd9b"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2f57b8"/><stop offset="1" stop-color="#5b8bf0"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d6fd8"/><stop offset="1" stop-color="#57c98a"/></linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
</defs><rect width="720" height="487" rx="14" fill="#191d26" stroke="#2b3140"/><path d="M16 16 h688 v30.0 h-688 z" fill="#232a3a"/><text x="29" y="35.5" font-size="12.5" font-weight="bold" fill="#c3cadd">Раздел</text><text x="179" y="35.5" font-size="12.5" font-weight="bold" fill="#c3cadd">Что настраивается</text><line x1="16" y1="46.0" x2="704" y2="46.0" stroke="#2b3140" stroke-width="1"/><rect x="16" y="46.0" width="688" height="73.4" fill="#1b1f29"/><text x="29" y="68.0" font-size="13.0" font-weight="bold" fill="#f2f4f8">Основные</text><text x="179" y="68.0" font-size="13.0" fill="#c3cadd">Язык перевода · что уходит в чат · язык интерфейса · горячая клавиша</text><text x="179" y="86.5" font-size="13.0" fill="#c3cadd">· масштаб окна · скобки перевода · лимит символов · раскрытие</text><text x="179" y="104.9" font-size="13.0" fill="#c3cadd">сокращений.</text><line x1="16" y1="119.4" x2="704" y2="119.4" stroke="#191d26" stroke-width="1"/><rect x="16" y="119.4" width="688" height="73.4" fill="#20242f"/><text x="29" y="141.4" font-size="13.0" font-weight="bold" fill="#f2f4f8">Автоперевод</text><text x="179" y="141.4" font-size="13.0" fill="#c3cadd">Частота «каждое N-е» · какое сообщение в серии · длина и число</text><text x="179" y="159.8" font-size="13.0" fill="#c3cadd">фрагментов · приоритет словаря · слова-паразиты «всегда» и их</text><text x="179" y="178.3" font-size="13.0" fill="#c3cadd">список.</text><line x1="16" y1="192.8" x2="704" y2="192.8" stroke="#191d26" stroke-width="1"/><rect x="16" y="192.8" width="688" height="54.9" fill="#1b1f29"/><text x="29" y="214.8" font-size="13.0" font-weight="bold" fill="#f2f4f8">Чат игры</text><text x="179" y="214.8" font-size="13.0" fill="#c3cadd">Вставлять в чат · сначала открывать чат клавишей T · отправлять по</text><text x="179" y="233.2" font-size="13.0" fill="#c3cadd">Enter · клавиша чата · три задержки для медленных серверов.</text><line x1="16" y1="247.7" x2="704" y2="247.7" stroke="#191d26" stroke-width="1"/><rect x="16" y="247.7" width="688" height="54.9" fill="#20242f"/><text x="29" y="269.7" font-size="13.0" font-weight="bold" fill="#f2f4f8">Словарь</text><text x="179" y="269.7" font-size="13.0" fill="#c3cadd">Таблица фраз с поиском, добавление и удаление, импорт JSON и CSV,</text><text x="179" y="288.1" font-size="13.0" fill="#c3cadd">экспорт, возврат встроенного словаря.</text><line x1="16" y1="302.6" x2="704" y2="302.6" stroke="#191d26" stroke-width="1"/><rect x="16" y="302.6" width="688" height="73.4" fill="#1b1f29"/><text x="29" y="324.6" font-size="13.0" font-weight="bold" fill="#f2f4f8">Сокращения</text><text x="179" y="324.6" font-size="13.0" fill="#c3cadd">Свои сокращения по образцу словаря: сокращение, разворот и</text><text x="179" y="343.1" font-size="13.0" fill="#c3cadd">короткий русский вариант. Своя строка перекрывает встроенную,</text><text x="179" y="361.5" font-size="13.0" fill="#c3cadd">пустые колонки выключают.</text><line x1="16" y1="376.0" x2="704" y2="376.0" stroke="#191d26" stroke-width="1"/><rect x="16" y="376.0" width="688" height="54.9" fill="#20242f"/><text x="29" y="398.0" font-size="13.0" font-weight="bold" fill="#f2f4f8">Проверка</text><text x="179" y="398.0" font-size="13.0" fill="#c3cadd">Живой предпросмотр в обе стороны: видно, что именно уйдёт в чат</text><text x="179" y="416.4" font-size="13.0" fill="#c3cadd">игры, и как это читается вслух.</text><rect x="15" y="429.90000000000003" width="690" height="2" fill="#191d26"/><text x="18" y="447.9" font-size="11.0" fill="#8b95a9">Подсказка есть у каждого поля. Окно подстраивается под экран, разделы прокручиваются, масштаб интерфейса</text><text x="18" y="464.4" font-size="11.0" fill="#8b95a9">меняется от 80 до 180 %.</text></svg>