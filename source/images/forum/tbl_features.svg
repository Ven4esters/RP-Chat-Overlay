<svg xmlns="http://www.w3.org/2000/svg" width="720" height="728" viewBox="0 0 720 728" font-family="DejaVu Sans, Noto Sans CJK SC, Noto Sans CJK JP, sans-serif"><defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0e1017"/><stop offset="0.55" stop-color="#151824"/>
    <stop offset="1" stop-color="#0f1319"/></linearGradient>
  <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2fa364"/><stop offset="1" stop-color="#6fdd9b"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#2f57b8"/><stop offset="1" stop-color="#5b8bf0"/></linearGradient>
  <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#3d6fd8"/><stop offset="1" stop-color="#57c98a"/></linearGradient>
  <pattern id="grid" width="26" height="26" patternUnits="userSpaceOnUse">
    <path d="M26 0H0V26" fill="none" stroke="#ffffff" stroke-opacity="0.035"/></pattern>
</defs><rect width="720" height="728" rx="14" fill="#191d26" stroke="#2b3140"/><path d="M16 16 h688 v30.0 h-688 z" fill="#232a3a"/><text x="29" y="35.5" font-size="12.5" font-weight="bold" fill="#c3cadd">Возможность</text><text x="241" y="35.5" font-size="12.5" font-weight="bold" fill="#c3cadd">Что происходит</text><line x1="16" y1="46.0" x2="704" y2="46.0" stroke="#2b3140" stroke-width="1"/><rect x="16" y="46.0" width="688" height="73.4" fill="#1b1f29"/><text x="29" y="68.0" font-size="13.0" font-weight="bold" fill="#f2f4f8">Перевод из русского</text><text x="241" y="68.0" font-size="13.0" fill="#c3cadd">Печатаете по-русски — в чат игры уходит фраза на</text><text x="241" y="86.5" font-size="13.0" fill="#c3cadd">выбранном языке. Русская запись остаётся под рукой: её</text><text x="241" y="104.9" font-size="13.0" fill="#c3cadd">видно в оверлее до отправки.</text><line x1="16" y1="119.4" x2="704" y2="119.4" stroke="#191d26" stroke-width="1"/><rect x="16" y="119.4" width="688" height="73.4" fill="#20242f"/><text x="29" y="141.4" font-size="13.0" font-weight="bold" fill="#f2f4f8">Режим для</text><text x="29" y="159.8" font-size="13.0" font-weight="bold" fill="#f2f4f8">иностранного игрока</text><text x="241" y="141.4" font-size="13.0" fill="#c3cadd">Пишете на своём языке — в чат уходит русский перевод</text><text x="241" y="159.8" font-size="13.0" fill="#c3cadd">целиком, вместе с действиями *…*. Служебные команды и</text><text x="241" y="178.3" font-size="13.0" fill="#c3cadd">ники не переводятся.</text><line x1="16" y1="192.8" x2="704" y2="192.8" stroke="#191d26" stroke-width="1"/><rect x="16" y="192.8" width="688" height="73.4" fill="#1b1f29"/><text x="29" y="214.8" font-size="13.0" font-weight="bold" fill="#f2f4f8">13 языков перевода</text><text x="241" y="214.8" font-size="13.0" fill="#c3cadd">От итальянского и испанского до китайского, японского и</text><text x="241" y="233.2" font-size="13.0" fill="#c3cadd">арабского. У одиннадцати языков есть встроенный словарь и</text><text x="241" y="251.7" font-size="13.0" fill="#c3cadd">слова-паразиты.</text><line x1="16" y1="266.1" x2="704" y2="266.1" stroke="#191d26" stroke-width="1"/><rect x="16" y="266.1" width="688" height="73.4" fill="#20242f"/><text x="29" y="288.1" font-size="13.0" font-weight="bold" fill="#f2f4f8">Словарь</text><text x="241" y="288.1" font-size="13.0" fill="#c3cadd">Готовые фразы с русской записью («как это читается вслух»)</text><text x="241" y="306.6" font-size="13.0" fill="#c3cadd">и значениями. Свои фразы добавляются в окне настроек,</text><text x="241" y="325.1" font-size="13.0" fill="#c3cadd">импорт из JSON и CSV.</text><line x1="16" y1="339.5" x2="704" y2="339.5" stroke="#191d26" stroke-width="1"/><rect x="16" y="339.5" width="688" height="73.4" fill="#1b1f29"/><text x="29" y="361.5" font-size="13.0" font-weight="bold" fill="#f2f4f8">Сленг и сокращения</text><text x="241" y="361.5" font-size="13.0" fill="#c3cadd">180 сокращений и растянутый смех: brb, afk, gg, tysm, afaik,</text><text x="241" y="380.0" font-size="13.0" fill="#c3cadd">wtb. Сокращение раскрывается до перевода, поэтому падеж</text><text x="241" y="398.4" font-size="13.0" fill="#c3cadd">и род получаются верными.</text><line x1="16" y1="412.9" x2="704" y2="412.9" stroke="#191d26" stroke-width="1"/><rect x="16" y="412.9" width="688" height="73.4" fill="#20242f"/><text x="29" y="434.9" font-size="13.0" font-weight="bold" fill="#f2f4f8">Автоперевод по</text><text x="29" y="453.4" font-size="13.0" font-weight="bold" fill="#f2f4f8">счётчику</text><text x="241" y="434.9" font-size="13.0" fill="#c3cadd">Переводится каждое N-е сообщение или только помеченное</text><text x="241" y="453.4" font-size="13.0" fill="#c3cadd">+маркерами+. Команды /to, /lto, /l, /wt, /s, /st считаются</text><text x="241" y="471.8" font-size="13.0" fill="#c3cadd">наравне с обычными.</text><line x1="16" y1="486.3" x2="704" y2="486.3" stroke="#191d26" stroke-width="1"/><rect x="16" y="486.3" width="688" height="73.4" fill="#1b1f29"/><text x="29" y="508.3" font-size="13.0" font-weight="bold" fill="#f2f4f8">Слова-паразиты</text><text x="241" y="508.3" font-size="13.0" fill="#c3cadd">Senti, Ma dai, Oye, китайские частицы — подставляются в</text><text x="241" y="526.7" font-size="13.0" fill="#c3cadd">каждом сообщении, независимо от счётчика. Список свой для</text><text x="241" y="545.2" font-size="13.0" fill="#c3cadd">каждого языка.</text><line x1="16" y1="559.7" x2="704" y2="559.7" stroke="#191d26" stroke-width="1"/><rect x="16" y="559.7" width="688" height="73.4" fill="#20242f"/><text x="29" y="581.7" font-size="13.0" font-weight="bold" fill="#f2f4f8">Отправка в игру</text><text x="241" y="581.7" font-size="13.0" fill="#c3cadd">Оверлей сам открывает чат клавишей T, вставляет текст и</text><text x="241" y="600.1" font-size="13.0" fill="#c3cadd">отправляет по Enter. Три задержки настраиваются, если</text><text x="241" y="618.6" font-size="13.0" fill="#c3cadd">сервер медленный.</text><line x1="16" y1="633.0" x2="704" y2="633.0" stroke="#191d26" stroke-width="1"/><rect x="16" y="633.0" width="688" height="54.9" fill="#1b1f29"/><text x="29" y="655.0" font-size="13.0" font-weight="bold" fill="#f2f4f8">Два языка интерфейса</text><text x="241" y="655.0" font-size="13.0" fill="#c3cadd">Первый запуск спрашивает: русский или English.</text><text x="241" y="673.5" font-size="13.0" fill="#c3cadd">Переключение — в настройках, сразу и без перезапуска.</text><rect x="15" y="686.9599999999999" width="690" height="2" fill="#191d26"/><text x="18" y="705.0" font-size="11.0" fill="#8b95a9">Всё перечисленное настраивается в окне программы и работает на чистой Windows без установки Python.</text></svg>