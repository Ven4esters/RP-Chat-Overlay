</defs><rect width="720" height="360" rx="14" fill="#191d26" stroke="#2b3140"/><path d="M16 16 h688 v30.0 h-688 z" fill="#232a3a"/><text x="29" y="35.5" font-size="12.5" font-weight="bold" fill="#c3cadd">Версия</text><text x="109" y="35.5" font-size="12.5" font-weight="bold" fill="#c3cadd">Главное</text><line x1="16" y1="46.0" x2="704" y2="46.0" stroke="#2b3140" stroke-width="1"/><rect x="16" y="46.0" width="688" height="73.4" fill="#1b1f29"/><text x="29" y="68.0" font-size="13.0" font-weight="bold" fill="#f2f4f8">1.5</text><text x="109" y="68.0" font-size="13.0" fill="#c3cadd">Адаптивное окно и масштаб интерфейса · цепочка сервисов перевода с</text><text x="109" y="86.5" font-size="13.0" fill="#c3cadd">подменой при ответе 429 · 180 сокращений · README на двух языках ·</text><text x="109" y="104.9" font-size="13.0" fill="#c3cadd">CHANGELOG.</text><line x1="16" y1="119.4" x2="704" y2="119.4" stroke="#191d26" stroke-width="1"/><rect x="16" y="119.4" width="688" height="54.9" fill="#20242f"/><text x="29" y="141.4" font-size="13.0" font-weight="bold" fill="#f2f4f8">1.4</text><text x="109" y="141.4" font-size="13.0" fill="#c3cadd">Английский интерфейс с выбором языка при первом запуске · свои сокращения ·</text><text x="109" y="159.8" font-size="13.0" fill="#c3cadd">проверка перевода в обе стороны.</text><line x1="16" y1="174.3" x2="704" y2="174.3" stroke="#191d26" stroke-width="1"/><rect x="16" y="174.3" width="688" height="36.5" fill="#1b1f29"/><text x="29" y="196.3" font-size="13.0" font-weight="bold" fill="#f2f4f8">1.3</text><text x="109" y="196.3" font-size="13.0" fill="#c3cadd">Сленг и сокращения раскрываются до перевода: brb → «я скоро вернусь».</text><line x1="16" y1="210.8" x2="704" y2="210.8" stroke="#191d26" stroke-width="1"/><rect x="16" y="210.8" width="688" height="36.5" fill="#20242f"/><text x="29" y="232.8" font-size="13.0" font-weight="bold" fill="#f2f4f8">1.2</text><text x="109" y="232.8" font-size="13.0" fill="#c3cadd">Короткое меню в трее из четырёх строк: статус, направление, настройки, выход.</text><line x1="16" y1="247.2" x2="704" y2="247.2" stroke="#191d26" stroke-width="1"/><rect x="16" y="247.2" width="688" height="36.5" fill="#1b1f29"/><text x="29" y="269.2" font-size="13.0" font-weight="bold" fill="#f2f4f8">1.1</text><text x="109" y="269.2" font-size="13.0" fill="#c3cadd">Режим для иностранного игрока: любой язык → русский, перевод уходит в чат.</text><line x1="16" y1="283.7" x2="704" y2="283.7" stroke="#191d26" stroke-width="1"/><rect x="16" y="283.7" width="688" height="36.5" fill="#20242f"/><text x="29" y="305.7" font-size="13.0" font-weight="bold" fill="#f2f4f8">1.0</text><text x="109" y="305.7" font-size="13.0" fill="#c3cadd">Первый выпуск: оверлей, 13 языков, словарь, автоперевод, отправка в игру.</text><rect x="15" y="319.14" width="690" height="2" fill="#191d26"/><text x="18" y="337.1" font-size="11.0" fill="#8b95a9">Подробности по каждой версии — в CHANGELOG.md в репозитории.</text></svg>