</defs><rect width="480" height="224" rx="12" fill="#1a1d26" stroke="#2b3040"/><text x="16" y="26" font-size="14" font-weight="bold" fill="#f2f4f8">Проверка перевода</text><text x="16" y="44" font-size="10.5" fill="#78829a">Введите фразу на языке сервера — увидите, что именно уйдёт в чат игры на</text><text x="16" y="58" font-size="10.5" fill="#78829a">русском.</text><text x="16" y="96" font-size="11" fill="#b9c0d4">Направление:</text><rect x="220" y="78" width="244" height="26" rx="6" fill="#11141c" stroke="#2b3040"/><text x="230" y="95.5" font-size="11.5" fill="#f2f4f8">Ваш язык → русский</text><path d="M446 89l4 5 4-5" fill="none" stroke="#78829a" stroke-width="1.4"/><rect x="16" y="112" width="448" height="28" rx="6" fill="#11141c" stroke="#3d6fd8"/><text x="26" y="130.5" font-size="11.5" fill="#f2f4f8">What y can r do? Afk man</text><rect x="16" y="148" width="448" height="64" rx="8" fill="#141822" stroke="#2b3040"/><text x="28" y="170" font-size="13" fill="#f2f4f8">я скоро вернусь, я не за клавиатурой</text><text x="28" y="187" font-size="10" fill="#78829a">Исходное сообщение: I'm not at the keyboard man</text><text x="28" y="203" font-size="10" fill="#57c98a">Способ: переведено в чат игры</text></svg>